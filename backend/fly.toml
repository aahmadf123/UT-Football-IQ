# Fly.io application configuration for the Football-IQ backend.
# See https://fly.io/docs/reference/configuration/ for full reference.

app = "football-iq-backend"
primary_region = "ord"  # Chicago — closest to Toledo, Ohio

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL    = "INFO"
  CORS_ORIGINS = "https://football-iq.pages.dev"
  # Permit this Pages project's preview deployments and the existing Vercel
  # deployment without opening the API to unrelated origins.
  CORS_ORIGIN_REGEX = "^https://football-iq(?:-[a-z0-9]+(?:-[a-z0-9]+)*)?\\.pages\\.dev$|^https://football-iq(?:-[a-z0-9]+(?:-[a-z0-9]+)*)?\\.vercel\\.app$"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 8000
    timeout      = "5s"
    type         = "http"

  [checks.ready]
    grace_period = "20s"
    interval     = "30s"
    method       = "GET"
    path         = "/ready"
    port         = 8000
    timeout      = "5s"
    type         = "http"
