# Checks the deployed platform the way a coach uses it: sign in with the
# shared team login and open every main page. Fails on console errors,
# failed API calls or raw error text on screen. Read-only.
#
# Runs after each successful Deploy (waiting for the new backend release),
# every morning, and on demand. Requires two repository secrets:
#   E2E_EMAIL      the shared team login
#   E2E_PASSWORD   its password
# Without them the job is skipped rather than failed.
name: Live smoke

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  crawl:
    name: Deployed site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EXPECT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check for credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$E2E_EXPECT_SHA" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$latest" != "$E2E_EXPECT_SHA" ]; then
              echo "A newer main release exists; skipping the obsolete smoke run."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::notice::Set the E2E_EMAIL and E2E_PASSWORD secrets to check the deployed site."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Install browser
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Crawl the deployed site
        if: steps.creds.outputs.ready == 'true'
        run: npm run e2e:live

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-smoke-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
