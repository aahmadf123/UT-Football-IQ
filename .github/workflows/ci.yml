name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint, typecheck, unit tests, migration check ────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    services:
      # pgvector/pgvector:pg16 is upstream Postgres 16 with the pgvector
      # extension preinstalled, required by the playembeddings table
      # introduced in migration 0008 (Issue #8 / #77).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: footiq
          POSTGRES_PASSWORD: footiq_test
          POSTGRES_DB: footiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://footiq:footiq_test@localhost:5432/footiq_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run unit tests
        run: pytest -v --cov=app --cov-report=xml

      - name: Migration check (alembic up then down)
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ── GPU worker: lint + stub-mode unit tests ──────────────────────────────
  # The pipeline package was previously not covered by any workflow. This
  # job runs the ~800 CPU-safe tests with the adapter stubs (no torch /
  # ultralytics — see requirements-ci.txt); real-model runs remain a local /
  # GPU-box concern.
  gpu-worker:
    name: GPU worker (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gpu-worker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gpu-worker/requirements*.txt

      - name: Install dependencies (stub mode)
        run: pip install -r requirements-ci.txt

      - name: Install ffmpeg (ingest probing + renderer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: pytest -v

  # ── Cross-service integration: API → job queue → worker → clips ──────────
  # Boots the real backend (its own venv, mirroring local dev) against
  # Postgres, uploads a synthetic clip through the Worker-parity endpoints,
  # and runs one in-process worker claim/process cycle. Detection and
  # segmentation are pinned to their deterministic stubs — this proves the
  # wiring (auth, storage, claim/heartbeat, writebacks, overlays), not model
  # quality.
  integration:
    name: Cross-service integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: footiq
          POSTGRES_PASSWORD: footiq_test
          POSTGRES_DB: footiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://footiq:footiq_test@localhost:5432/footiq_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            gpu-worker/requirements-ci.txt

      - name: Install backend into its own venv (fixture prefers backend/.venv)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Install worker deps (stub mode)
        run: pip install -r gpu-worker/requirements-ci.txt

      - name: Install ffmpeg (ingest probing + renderer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run integration suite
        working-directory: gpu-worker
        run: pytest -m integration tests/integration/ -v

  # ── Cloudflare Workers: lint, typecheck ──────────────────────────────────
  workers:
    name: Cloudflare Workers (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Frontend: lint, typecheck, build ────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Frontend E2E: Playwright deterministic suite ────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run Playwright E2E suite
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
