name: CD — Deploy

# Deploys on every push to main:
#   1. Cloudflare Worker  (workers/)  — also syncs JWT_SECRET from the repo's
#      SECRET_KEY secret so the worker can verify backend-issued JWTs.
#   2. Frontend → Cloudflare Pages (frontend/) — static export with production
#      API/Worker URLs baked in at build time (NEXT_PUBLIC_* is inlined).
#   3. Backend → Fly.io (backend/) — aligns Fly's SECRET_KEY with the repo
#      secret, deploys, then runs Alembic migrations inside the machine.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                        FLY_API_TOKEN, SECRET_KEY
# Optional repo secrets: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WORKER_URL
#                        (defaults below point at the live production hosts)
#
# The Vercel deployment is separate: Vercel's GitHub integration builds every
# push on its own — nothing to do here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Deploy Cloudflare Worker ─────────────────────────────────────────────
  deploy-workers:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$SECRET_KEY" ] && missing="$missing SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          # workers/package.json requires node >=22
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + dry-run)
        run: npm run build

      # Explicit wrangler steps (instead of wrangler-action) so failures are
      # surfaced as check-run annotations with the real API error message.
      - name: Probe token type and Workers API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # A user-owned token verifies on /user/tokens/verify; an account-owned
          # token only verifies on /accounts/:id/tokens/verify. Wrangler has
          # known gaps with account-owned tokens.
          user_v=$(curl -s --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('success') else 'fail')" 2>/dev/null || echo parse-error)
          acct_v=$(curl -s --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('success') else 'fail')" 2>/dev/null || echo parse-error)
          echo "::notice title=Token type probe::user-endpoint=$user_v account-endpoint=$acct_v (user-owned tokens: user=ok; account-owned tokens: user=fail account=ok)"

          # Token ID (not the secret value) — compare with the ID in the
          # dashboard token URL to confirm WHICH token the GH secret holds.
          tid=$(curl -s --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('id','unknown'))" 2>/dev/null || echo unknown)
          echo "::notice title=Token ID in use::$tid"

          out=$(npx wrangler deployments list 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            summary=$(echo "$out" | grep -iE "error|fail|unauthorized|forbidden|code:" | head -6 | tr '\n' ' § ' | cut -c1-900)
            echo "::error title=Workers API read probe failed::${summary:-nonzero exit}"
            exit 1
          fi
          echo "::notice title=Workers API read probe OK::token can read Worker deployments"

      # Secret sync runs before deploy: it doubles as a write-permission probe.
      # If the token cannot write Workers (Scripts:Edit missing), the job
      # SOFT-SKIPS with a warning instead of failing the whole pipeline —
      # the worker's code and JWT_SECRET persist from the last deploy, and
      # local deploys (npm run deploy + scripts/sync-worker-secret.ps1) cover
      # worker changes until the token gains write access, at which point this
      # job resumes deploying automatically.
      - name: Sync JWT_SECRET and deploy worker (soft-skip if token cannot write)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.SECRET_KEY }}
        run: |
          set +e
          out=$(printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET 2>&1); code=$?
          echo "$out" | grep -vF "$JWT_SECRET"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qiE "authentication error|code: 10000"; then
              echo "::warning title=Worker deploy skipped — token cannot write Workers::CLOUDFLARE_API_TOKEN lacks 'Workers Scripts: Edit'. The live worker keeps its current code and JWT_SECRET; deploy worker changes locally with 'npm run deploy' in workers/. Granting the permission makes this job resume deploying automatically."
              exit 0
            fi
            summary=$(echo "$out" | grep -iE "error|fail|unauthorized|forbidden|code:" | grep -vF "$JWT_SECRET" | head -6 | tr '\n' ' § ' | cut -c1-900)
            echo "::error title=wrangler secret put failed::${summary:-nonzero exit}"
            exit 1
          fi
          echo "::notice title=JWT_SECRET synced::worker secret now matches repo SECRET_KEY"

          out=$(npx wrangler deploy 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            summary=$(echo "$out" | grep -iE "error|fail|unauthorized|forbidden|code:" | head -6 | tr '\n' ' § ' | cut -c1-900)
            echo "::error title=wrangler deploy failed::${summary:-nonzero exit}"
            exit 1
          fi

  # ── Deploy Frontend to Cloudflare Pages ─────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing repo secret CLOUDFLARE_API_TOKEN — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://football-iq-backend.fly.dev' }}
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_WORKER_URL || 'https://football-iq.firas-azfar.workers.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=football-iq --branch=main
          workingDirectory: frontend

  # ── Deploy Backend (Docker → Fly.io) ────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Fly.io)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing repo secret FLY_API_TOKEN — create one with 'flyctl tokens create deploy -a football-iq-backend' and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Align Fly SECRET_KEY with repo secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -n "$SECRET_KEY" ]; then
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY" | flyctl secrets import --stage -a football-iq-backend
          else
            echo "SECRET_KEY repo secret not set — leaving Fly's current value in place."
          fi

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Wait for /ready
        run: |
          for i in $(seq 1 24); do
            status=$(curl -s --max-time 10 https://football-iq-backend.fly.dev/ready | grep -o '"status":"ready"' || true)
            if [ -n "$status" ]; then
              echo "Backend ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend did not become ready within 120s."
          exit 1

      - name: Run DB migrations (inside the machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console -a football-iq-backend -C "sh -lc 'cd /app && alembic upgrade head'"
