# workers/wrangler.toml
name = 'football-iq'
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ── Bindings ──────────────────────────────────────────────────────────────────

# Cloudflare R2 buckets
[[r2_buckets]]
binding = "RAW_VIDEO"
bucket_name = "raw-video"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "clips"

[[r2_buckets]]
binding = "OVERLAYS"
bucket_name = "overlays"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "artifacts"

# Job dispatch and the nightly cron moved off the edge: the backend's
# processing_jobs table is the queue (claimed by the GPU worker) and the
# backend scheduler owns the nightly workload rollup. The former queue
# producer bindings and [triggers] cron were removed with that migration.

# ── Secrets (set via `wrangler secret put <NAME>`) ────────────────────────────
# JWT_SECRET — must equal the backend's SECRET_KEY (the worker verifies
#              backend-issued HS256 JWTs and HMAC-signs /dl/* stream URLs).
#              CD syncs it from the repo's SECRET_KEY secret on every deploy;
#              scripts/sync-worker-secret.ps1 does the same thing locally.

# The worker serves on its workers.dev subdomain
# (https://football-iq.firas-azfar.workers.dev). The former [env.production]
# routes block was invalid — workers.dev is not a user zone — and deploys
# never used it, so it was removed.
